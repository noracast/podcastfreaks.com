# 番組ごとの Apple Podcasts のリンクを data/apple-podcasts.json に記録する。
#
# 照合は iTunes Search API の検索結果に含まれる feedUrl が data/rss.json の
# feed と一致するか、で行う。番組名の近さで採用すると別番組を掴むため。
#
# 既にファイルにある番組は調べ直さないので、通常は追加された番組のぶんだけ
# 通信する。フィードURLが Apple 側と違って自動では取れない番組は、
# "source": "manual" として手で書き足せる（この処理では触らない）。
#
# GITHUB_TOKEN によるコミットはワークフローを再トリガーしない。
#
# Ref: https://github.com/noracast/podcastfreaks.com/issues/41

name: Apple Podcasts のリンクを記録する

on:
  push:
    branches: [main]
    paths: ['data/rss.json']
  # 見つからなかった番組を調べ直したいときに手動で流す
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 番組名の検索に build_info.json のタイトルを使うため、
      # フィードを取得してから実行する
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prebuild

      # スクリプト自体は依存なしの素の Node で動く
      - name: Apple Podcasts のリンクを調べる
        run: node scripts/update-apple-podcasts-cli.js

      - name: 変更があればコミットする
        run: |
          if git diff --quiet data/apple-podcasts.json; then
            echo "変更はありません"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/apple-podcasts.json
          git commit -m 'Apple Podcasts のリンクを記録する'
          git push
