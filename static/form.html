<!DOCTYPE html>
<html>
<head>
  <title>Netlify Formsのためのダミーページ</title>
</head>
<body>
  <form name="register-request" method="POST" netlify data-netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="register-request">
    <!-- ここから -->
    <!-- スパム対策の隠しフィールド。人には見えないので、値が入っていたら bot と判断される -->
    <p hidden><label>入力しないでください <input name="bot-field"></label></p>
    <input type="text" name="feed">
    <input type="text" name="twitter">
    <input type="text" name="hashtag">
    <input type="text" name="contributor">
    <textarea name="message"></textarea>
    <!-- /ここまでをregisterページの内容と合わせる必要あり -->
    <button type="submit">Send</button>
  </form>
</body>
</html>
